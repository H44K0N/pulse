# Version catalog: the ONLY place dependency and plugin versions are written.
#
# Compatibility (checked 2026-11 against the official tables):
#   - Kotlin Gradle plugin 2.4.20-2.4.21 supports Gradle 7.6.3-9.7.0 and AGP 8.5.2-9.3.1
#     (https://kotlinlang.org/docs/gradle-configure-project.html).
#   - AGP 9.3 requires Gradle >= 9.5.0 and JDK 17+
#     (https://developer.android.com/build/releases/about-agp).
#   So: Gradle 9.7.1 (wrapper), Kotlin 2.4.21, AGP 9.3.3 is the newest fully supported set.
#   AGP 9.5 / Gradle 9.9 exist but are outside Kotlin 2.4's tested range; bump them
#   together with Kotlin 2.5.0 once it is stable.
#
# :app (Milestone 2), latest stable versions checked 2026-11-13:
#   - compileSdk/targetSdk stay at 36 (the newest platform installed on the build machine).
#     Android 17 (API 37) is stable, and the newest AndroidX releases require compileSdk 37:
#     core 1.19, Compose 1.12 (BOM 2026.08.00+), lifecycle 2.11. Until the project moves to
#     compileSdk 37 these are held at the newest versions that build against 36:
#     core 1.18.0, Compose BOM 2026.06.01 (Compose 1.11.4, Material3 1.4.0), lifecycle 2.10.0.
#     To move: install "platforms;android-37.0", set compileSdk = 37, then bump these three.
#   - Room 2.8.x (androidx.room) rather than Room 3 (androidx.room3): Room 3 is a new package
#     with a different, driver-based API. 2.8 is the mature, documented line and still patched.
#   - KSP is required by Room's annotation processor (kapt is deprecated).
#   - kotlinx.serialization (JetBrains, official): turns Kotlin data classes into the JSON of
#     docs/session-format.md at compile time; works in plain JVM tests (org.json does not:
#     it is stubbed in Android unit tests). Milestone 5 (sync) reuses it.
#   - Polar BLE SDK: comes from JitPack only, see settings.gradle.kts for the lock-down.
#   - Robolectric (tests only): runs Room against a real SQLite in JVM unit tests, since this
#     project has no emulator/device to run instrumented tests on.
[versions]
agp = "9.3.3"
kotlin = "2.4.21"
coroutines = "1.11.0"
ksp = "2.3.14"
androidx-core = "1.18.0"
activity-compose = "1.13.0"
compose-bom = "2026.06.01"
lifecycle = "2.10.0"
room = "2.8.5"
datastore = "1.3.0"
serialization = "1.13.0"
polar-ble-sdk = "8.6.0"
junit = "4.13.2"
robolectric = "4.18"
androidx-test-core = "1.7.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
polar-ble-sdk = { module = "com.github.polarofficial:polar-ble-sdk", version.ref = "polar-ble-sdk" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP 9 has built-in Kotlin support, so :app does not need the separate kotlin-android
# plugin; Compose needs the Kotlin compose compiler plugin.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Room's Gradle plugin: exports the database schema JSON to app/schemas (committed) so
# future versions can write and test migrations.
room = { id = "androidx.room", version.ref = "room" }
